<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>刷题</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e8ecf3;--dim:#98a2b3;--ok:#35c47f;--bad:#ff6b6b;--acc:#4c8dff;--warn:#ffcc66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif}
body{padding:0 12px 40px;max-width:760px;margin:0 auto}
header{position:sticky;top:0;background:var(--bg);padding:8px 0 6px;z-index:9;border-bottom:1px solid var(--line)}
.h1{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:600;align-items:baseline}
.sub{font-size:12px;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.stem{font-size:17px;line-height:1.85;white-space:pre-wrap}
.tags{font-size:12px;color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between}
.opt{display:block;width:100%;text-align:left;background:#1d222c;border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:13px 14px;margin:8px 0;font-size:16px;line-height:1.5;font-family:inherit}
.opt.sel{border-color:var(--acc);background:#1b2740}
.opt.right{border-color:var(--ok);background:#132a20}
.opt.wrong{border-color:var(--bad);background:#2c1618}
input[type=text]{width:100%;background:#1d222c;border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:14px;font-size:18px;margin:6px 0;font-family:inherit}
.btn{display:inline-block;background:var(--acc);color:#fff;border:none;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:600;margin:8px 8px 0 0;font-family:inherit}
.btn.ghost{background:#242a36;color:var(--fg)}
.btn.wide{display:block;width:100%;margin:8px 0}
.link{display:block;width:100%;background:none;border:none;color:var(--dim);font-size:14px;padding:12px 0;text-decoration:underline;font-family:inherit}
.res{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:15px;line-height:1.8}
.ok{color:var(--ok)}.bad{color:var(--bad)}.dim{color:var(--dim)}.warn{color:var(--warn)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#0b0d11;border-radius:8px;padding:8px;word-break:break-all;max-height:220px;overflow:auto;white-space:pre-wrap;width:100%}
.stalebar{display:none;margin:8px 0 2px;padding:9px 12px;border-radius:10px;background:#3a2213;border:1px solid #8a5320;color:#ffcea1;font-size:14px;line-height:1.6;cursor:pointer}
.stalebar b{color:#ffb26b}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2a3242;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="h1"><span id="bk">题库</span><span class="sub" id="bd"></span></div>
  <div class="sub" id="st">载入中…</div>
  <div class="stalebar" id="wbf"></div>
</header>
<main id="app"></main>
<div id="toast"></div>
<script src="bank.js?v=1793629951" onerror="window.__noBank=1"></script>
<script>
'use strict';
/* ---------- 工具 ---------- */
function $(id){return document.getElementById(id)}
function p2(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function nowIso(){var d=new Date();return ymd(d)+'T'+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())+'+08:00'}
function uid(){return 'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mmss(ms){var s=Math.round(ms/1000);if(s<60)return s+'秒';return Math.floor(s/60)+'分'+(s%60?(s%60)+'秒':'')}
var toastT=null;
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},1800)}

/* ---------- 存储 ---------- */
var RKEY='qz_rec_v1', HKEY='qz_hist_v1', storeOK=true;
function recsRaw(){try{var v=localStorage.getItem(RKEY);return v?JSON.parse(v):[]}catch(e){storeOK=false;return []}}
function recsSet(a){try{localStorage.setItem(RKEY,JSON.stringify(a));return true}catch(e){storeOK=false;return false}}
function histRaw(){try{var v=localStorage.getItem(HKEY);return v?JSON.parse(v):{}}catch(e){storeOK=false;return {}}}
function histSet(o){try{localStorage.setItem(HKEY,JSON.stringify(o));return true}catch(e){storeOK=false;return false}}
function lastExp(){try{return localStorage.getItem('qz_last_exp')||''}catch(e){return ''}}
function pending(){var a=recsRaw(),w=lastExp(),n=0;for(var i=0;i<a.length;i++)if(!w||a[i].ts>w)n++;return n}
/* 【2026-10-30 新增】今日统计：今日已答 / 今日正确率（只算已判的题） */
function todayStat(){
  var a=recsRaw(),n=0,judged=0,ok=0;
  for(var i=0;i<a.length;i++){var r=a[i];if(String(r.ts||'').slice(0,10)!==TD)continue;
    n++; if(r.judged){judged++; if(r.ok)ok++}}
  return {n:n,judged:judged,ok:ok};
}
function todayRecs(){
  return recsRaw().filter(function(r){return String(r.ts||'').slice(0,10)===TD});
}

/* ---------- 归一化（只用于选择题字母比对）---------- */
function norm(s){s=String(s==null?'':s);try{s=s.normalize('NFKC')}catch(e){}return s.replace(/\s+/g,'').toUpperCase()}
function judgeChoice(q,mine){
  var A=norm(q.answer).split('').sort().join('');
  var B=norm(mine).split('').sort().join('');
  return A.length>0&&A===B;
}

/* ---------- 题库 ---------- */
var DEMO={id:'demo',title:'题库未加载',questions:[{id:'demo-1',sub:'数学',topic:'极限',type:'choice',stem:'占位题：请把 题库.js 放到同目录。',options:['A. 好','B. 收到'],answer:'A'}]};
var WB_BUILD='2026-11-02';   /* 与 bank_src.json 的 id 对齐；不一致即判定为旧缓存 */
var BANK=(window.QBANK&&window.QBANK.questions&&window.QBANK.questions.length)?window.QBANK:DEMO;
/* 【2026-11-02 23:0x 用户口径】难度标尺：近十年真题平均 = 100，出题必须 95–130。
   题库里大部分题当年是按「手机能算」出的，实测中位只有 65 分，全部低于门槛。
   故加硬门槛：只有 df>=95 的题进队列，其余留在库里改造，不删也不出。
   库存不足时页面顶部会明确提示「可用 N 题」，不偷偷塞简单题。 */
var DF_MIN = 95;
var ALL_RAW = BANK.questions.slice();
var ALL = ALL_RAW.filter(function(q){ return (q.df||0) >= DF_MIN; });
var ALL_LOW = ALL_RAW.length - ALL.length;
var TD=ymd(new Date());
var H=histRaw();

/* ---------- 队列：到期优先，其后按题库顺序 ---------- */
/* 【2026-10-29 用户口径】备用机只做数学诊断题；顺序随机；每天目标 30–60 题 */
var DAILY_MIN=30, DAILY_MAX=60;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
/* 【2026-11-01 改 · 哈尼签字 A】配额置顶，取代「前 30 题必为数学」
   旧规则 head=M.slice(0,30)：队首整段被数学占满，第 31 位起才是其他三科。
   用户每天做 20 题 ⇒ 政治/专业课永远轮不到（结构性饿死，非偶发）。
   新规则：四科按配额交错占最前 30 位，做到第 20 题时政治/专业课/英语都已出现。 */
var QUOTA={'数学':20,'政治':5,'专业课':3,'英语':2};
/* 【2026-11-02 改】纯 shuffle 会让失分最高的考点反而抽不到：
   实测 #26 偏导 5 道、#7 参数方程 pin 5 道，连续两天一道都没进队。
   改为按考点失分权重分层 → 层内打乱 → 层间轮转，高失分考点必然排在前面。 */
var KPW={'#32':46,'#1':45,'#28':41,'#48':41,'#7':40,'#26':35,'#17':20,'#21':12};
function ordW(list){
  var g={};
  list.forEach(function(q){var k=q.kp||'';(g[k]=g[k]||[]).push(q)});
  Object.keys(g).forEach(function(k){g[k]=shuffle(g[k])});
  var keys=Object.keys(g).sort(function(a,b){return (KPW[b]||0)-(KPW[a]||0)});
  var out=[],more=true,i=0;
  while(more){
    more=false;
    for(var j=0;j<keys.length;j++){
      var arr=g[keys[j]];
      if(i<arr.length){out.push(arr[i]);more=true}
    }
    i++;
  }
  return out;
}
function ord(list){
  var due=[],later=[];
  list.forEach(function(q){var h=H[q.id];if(!h||!h.due||h.due<=TD)due.push(q);else later.push(q)});
  return ordW(due).concat(shuffle(later));
}
function buildQueue(){
  /* 【2026-10-30 用户口径】数学选填**同一题只出现一次**（做过就不再推，除非点名的重点题）；
     英语/政治/专业课仍按到期重复。数学新题不足时，尾部自动让位给其他三科。 */
  var answered={};
  try{recsRaw().forEach(function(r){if(r.qid)answered[r.qid]=1})}catch(e){}
  var M=ord(ALL.filter(function(q){return (q.sub||'')==='数学' && !answered[q.id] && !q.pin}));
  var P=ord(ALL.filter(function(q){return (q.sub||'')!=='数学'}));
  var PIN=ALL.filter(function(q){return q.pin}); /* 题组保序：不能过 ord()，ord 里面有 shuffle */
  /* 四科配额：数学取未做前 20 道，政治 5 / 专业课 3 / 英语 2 从各自的到期队列里取 */
  var used={};
  /* 【2026-11-02 改】pin 组前 4 道固定在最前，它们本身就是数学题，
     所以数学配额要相应扣掉 4，否则前 30 位数学会超配（实测 22 道）、政治被挤到 3 道。 */
  var PIN_HEAD_N=4;
  var mathHead=M.slice(0, Math.max(0,(QUOTA['数学']||20)-PIN_HEAD_N));
  mathHead.forEach(function(q){used[q.id]=1});
  var others=[], pools={};
  ['政治','专业课','英语'].forEach(function(sub){
    var n=QUOTA[sub]||0, got=0, arr=[];
    for(var i=0;i<P.length && got<n;i++){
      if((P[i].sub||'')===sub && !used[P[i].id]){ arr.push(P[i]); used[P[i].id]=1; got++; }
    }
    pools[sub]=arr;
  });
  /* 非数学三科轮转排列（政/专/英/政/专/英…），避免英语 2 道全被推到 20 位之后 */
  var more=true;
  while(more){
    more=false;
    ['政治','专业课','英语'].forEach(function(sub){
      if(pools[sub] && pools[sub].length){ others.push(pools[sub].shift()); more=true; }
    });
  }
  /* 均匀交错，而不是整体洗牌：洗牌有可能把政治全推到 21 位以后，等于问题没解决 */
  var head=[], mi=0, oi=0;
  var step=others.length ? ((QUOTA['数学']||20)+others.length)/others.length : 1e9;
  var nextAt=Math.max(1, Math.round(step*0.6));
  while(mi<mathHead.length || oi<others.length){
    if(oi<others.length && (mi>=mathHead.length || head.length+1>=nextAt)){ head.push(others[oi++]); nextAt+=step; }
    else head.push(mathHead[mi++]);
  }
  var rest=[];
  M.forEach(function(q){if(!used[q.id])rest.push(q)});
  P.forEach(function(q){if(!used[q.id])rest.push(q)});
  /* 【2026-11-01 用户口径】带 pin 的「计算题组」必须**整组连着出**，不许被洗散：
     组顺序按 pin 值首次出现排，组内保持题库原序（M1102-101→105 这样） */
  var pg={}, pgOrder=[];
  PIN.forEach(function(q){var g=q.pin||'_';if(!pg[g]){pg[g]=[];pgOrder.push(g);}pg[g].push(q);});
  var pinAll=[];
  pgOrder.forEach(function(g){pinAll=pinAll.concat(pg[g]);});
  /* 【2026-11-02 改】pin 组原来整组排在 head 之后（第 31 位起）。用户每天做 20–30 题，
     永远够不到 —— 实测 M1102-101~110 十道一道未做，白做实了。
     现改为：① 前 4 道放在最前；② 余下 6 道每两天带 2 道轮转；③ 不再进 rest。 */
  var pinHead=pinAll.slice(0,PIN_HEAD_N);
  var pinRest=pinAll.slice(PIN_HEAD_N);
  var _di=Math.floor(Date.now()/86400000);
  var pinExtra=pinRest.slice((_di%3)*2,(_di%3)*2+2);
  var rest2=[];
  rest.forEach(function(q){if(!q.pin)rest2.push(q)});
  /* 未被选中的 pin 题也要进队列，否则刷完一轮总数不足（实测少 4 道）
     顺序：pin 前 4 → 主队（严格 20/5/3/2）→ 轮转 pin 2 → 其余 → 剩余 pin
     pinExtra 必须放在 head 之后，否则它占掉数学配额、把政治挤到 3 道。 */
  var pinLeft=pinRest.filter(function(q){return pinExtra.indexOf(q)<0});
  return pinHead.concat(head).concat(pinExtra).concat(shuffle(rest2)).concat(pinLeft);
}
var S={set:buildQueue(),qi:0,judged:false,t0:Date.now(),mine:'',mult:[],res:[],done:false};

/* ---------- 顶部 ---------- */
function refreshBar(){
  $('bk').textContent=BANK.title||'题库';
  var due=0;ALL.forEach(function(q){var h=H[q.id];if(!h||!h.due||h.due<=TD)due++});
  /* 【2026-11-02】难度门槛生效：显示可用题数与被门槛挡掉的题数，库存不足要看得见 */
  var dfTip = ' · 可用 '+ALL.length+' 题（难度≥'+DF_MIN+'）';
  if(ALL_LOW>0) dfTip += ' · <span style="color:var(--warn)">'+ALL_LOW+' 题未达门槛暂不出</span>';
  $('bd').innerHTML=BANK.id+' · 题库 '+ALL.length+' 题 · 到期 '+due+dfTip;
  var okn=0,ch=0;
  for(var i=0;i<S.res.length;i++){var r=S.res[i];if(r.type!=='fill'){ch++;if(r.ok)okn++}}
  var pd=pending();
  var t=todayStat();
  $('st').innerHTML='本次已刷 '+S.res.length+' / 目标 '+DAILY_MIN+'–'+DAILY_MAX+' 题 · 选择 '+okn+'/'+ch+
    '<br><b>今日已答 '+t.n+' 题 · 正确率 '+(t.judged? (Math.round(100*t.ok/t.judged)+'%') : '—')+
    '</b>（判过 '+t.judged+' 题，对 '+t.ok+'）'+
    ' · <b class="'+(pd?'warn':'ok')+'" id="pend" onclick="renderRecords()">待导出 '+pd+'</b>'+
    (storeOK?'':' · <span class="bad">本地存储不可用</span>');
  wbFresh();
}

/* ---------- 旧缓存自检：题库日期与页面版本不一致就提示一键清缓存 ---------- */
function wbStale(){return String((window.QBANK&&window.QBANK.id)||'')!==WB_BUILD}
function wbFresh(){
  var bar=$('wbf');if(!bar)return;
  if(!window.QBANK||!window.QBANK.id){
    bar.style.display='block';
    bar.innerHTML='<b>⚠ 题库没载入</b>（离线或缓存异常）→ <b>点这里重新载入</b>';
    bar.onclick=wbHardReset;return;
  }
  if(!wbStale()){bar.style.display='none';return}
  bar.style.display='block';
  bar.innerHTML='<b>⚠ 显示的是旧缓存题库</b>（'+esc(String(QBANK.id))+'／'+ALL.length+
    ' 题，应为 '+WB_BUILD+'）→ <b>点这里清掉缓存并重新载入</b>';
  bar.onclick=wbHardReset;
}
function wbHardReset(){
  if(!confirm('将清空本站缓存并重新载入，答题记录不受影响。继续？'))return;
  toast('正在清缓存…');
  var jobs=[];
  if(window.caches&&caches.keys)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}));
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));
  var go=function(){location.replace(location.pathname+'?fresh='+Date.now())};
  try{Promise.all(jobs).then(go,go)}catch(e){go()}
}

/* ---------- 渲染题 ---------- */
function renderQ(){
  var q=S.set[S.qi];
  if(!q){renderDone();return}
  S.judged=false;S.mine='';S.mult=[];S.t0=Date.now();
  var h=H[q.id]||{};
  var type=q.type||'choice';
  var opts=q.options||['A','B','C','D'];
  var html='<div class="card">';
  html+='<div class="tags"><span>'+esc(q.sub||'')+' · '+(type==='fill'?'填空':(type==='multi'?'多选':'单选'))+
        '</span><span>'+esc(q.id)+' · 第 '+(S.qi+1)+'/'+S.set.length+'</span></div>';
  html+='<div class="stem">'+esc(q.stem)+'</div>';
  html+='<div id="ansbox" style="margin-top:10px">';
  if(type==='choice'||type==='multi'){
    for(var i=0;i<opts.length;i++){
      html+='<button class="opt" data-i="'+i+'" onclick="pick('+i+')">'+esc(opts[i])+'</button>';
    }
    if(type==='multi')html+='<div class="sub" style="margin:4px 0 0">多选：选完点提交</div>';
    html+='<button class="btn wide" style="margin-top:12px" onclick="submitChoice()">提交</button>';
  }else{
    html+='<div class="sub" style="margin:2px 0 4px;color:var(--warn)">⚠ 填空不计分，只作练习 · 对错由电脑端另行判</div>';
    html+='<input id="fill" type="text" autocomplete="off" spellcheck="false" placeholder="填答案；符号打不出就写文字（如「二分之根号三」）" oninput="S.mine=this.value">';
    html+='<button class="btn wide" style="margin-top:6px" onclick="submitFill()">提交</button>';
  }
  html+='<button class="link" onclick="skipQ()">不会，看答案</button>';
  // 2026-11-02 21:13 用户要求：工位上算不了、又不许空着下一题，只能点「不会」，
  // 导致 blank=true 里混了大量「客观算不了」被误判成「不会」。加一个跳过口。
  html+='<button class="link" style="color:var(--dim);margin-left:14px" onclick="nextOnly()">现在做不了，跳过</button>';
  html+='</div></div>';
  $('app').innerHTML=html;
  refreshBar();
  var f=$('fill');if(f)f.focus();
  window.scrollTo(0,0);
}

function pick(i){
  if(S.judged)return;
  var q=S.set[S.qi],type=q.type||'choice';
  var L='ABCDEFGH'[i];
  if(type==='multi'){
    var k=S.mult.indexOf(L);
    if(k<0)S.mult.push(L);else S.mult.splice(k,1);
    S.mult.sort();S.mine=S.mult.join('');
    var bs=document.querySelectorAll('.opt');
    for(var j=0;j<bs.length;j++)bs[j].classList.toggle('sel',S.mult.indexOf('ABCDEFGH'[j])>=0);
  }else{
    S.mine=L;
    var b2=document.querySelectorAll('.opt');
    for(var t=0;t<b2.length;t++)b2[t].classList.toggle('sel',t===i);
    submitChoice();
  }
}

/* ---------- 记录 ---------- */
function saveRecord(q,skip){
  var ms=Date.now()-S.t0;
  var type=q.type||'choice';
  var mine=skip?'':S.mine;
  var ok=null,judged=false;
  if(!skip&&(type==='choice'||type==='multi')){ok=judgeChoice(q,mine);judged=true}
  var h=H[q.id]||{n:0,streak:0};
  var attempt=(h.n||0)+1;
  var rec={id:uid(),ts:nowIso(),bank:BANK.id,qid:q.id,type:type,sub:q.sub||'',topic:q.topic||'',
           mine:mine,ans:q.answer,ok:ok,judged:judged,ms:ms,blank:!!skip,skipped:false,attempt:attempt,ve:1};
  var arr=recsRaw();arr.push(rec);recsSet(arr);
  var nd=new Date();
  if(judged&&ok===false){h.streak=0;nd.setDate(nd.getDate()+1)}
  else if(judged&&ok===true){h.streak=(h.streak||0)+1;var dl=[7,15,22,29,36,43][Math.min(h.streak-1,5)];nd.setDate(nd.getDate()+dl)}
  else {h.streak=h.streak||0;nd.setDate(nd.getDate()+3)}
  h.n=attempt;h.due=ymd(nd);h.last=nowIso();h.ok=(ok===null?null:ok);
  H[q.id]=h;histSet(H);
  S.res.push(rec);S.judged=true;
  return {rec:rec,h:h};
}

function submitChoice(){
  if(S.judged)return;
  if(!S.mine){toast('先选一个');return}
  var q=S.set[S.qi];
  var r=saveRecord(q,false);
  maybeAutoExport();
  renderResult(q,r.rec,r.h);
}
function submitFill(){
  if(S.judged)return;
  var q=S.set[S.qi];
  if(!String(S.mine||'').trim()){toast('写点东西再提交，或点「不会」');return}
  var r=saveRecord(q,false);
  maybeAutoExport();
  renderResult(q,r.rec,r.h);
}
function skipQ(){
  if(S.judged)return;
  var q=S.set[S.qi];
  var r=saveRecord(q,true);
  maybeAutoExport();
  renderResult(q,r.rec,r.h);
}
/* 2026-11-02 21:13 新增：跳过 ≠ 不会。
   只留痕，不动复习调度（due/streak 保持原样），下次还会出现；
   记录里写 skipped:true，与 blank:true 分开，供统计区分「算不了」和「真不会」。 */
function nextOnly(){
  if(S.judged)return;
  var q=S.set[S.qi];
  var ms=Date.now()-S.t0;
  var rec={id:uid(),ts:nowIso(),bank:BANK.id,qid:q.id,type:q.type||'choice',
           sub:q.sub||'',topic:q.topic||'',mine:'',ans:q.answer,
           ok:null,judged:false,ms:ms,blank:false,skipped:true,
           attempt:((H[q.id]||{}).n||0)+1,ve:1};
  var arr=recsRaw();arr.push(rec);recsSet(arr);
  S.res.push(rec);
  maybeAutoExport();
  nextQ();
}

function renderResult(q,rec,h){
  var type=q.type||'choice';
  var html='<div class="res">';
  if(rec.blank){
    html+='<div class="dim">记一笔：这题空着了</div>';
  }else if(rec.judged){
    html+='<div class="'+(rec.ok?'ok':'bad')+'">'+(rec.ok?'✓ 对':'✗ 错')+'　用时 '+mmss(rec.ms)+'</div>';
  }else{
    html+='<div class="dim">已交（用时 '+mmss(rec.ms)+'）· 填空对错由电脑上的 agent 判</div>';
  }
  html+='<div>正确答案：<b class="ok">'+esc(q.answer)+'</b></div>';
  if(!rec.blank&&!rec.judged)html+='<div class="dim">你写的：'+(esc(rec.mine)||'（空）')+'</div>';
  if(q.key)html+='<div style="margin-top:6px">'+esc(q.key)+'</div>';
  if(rec.blank&&q.hook)html+='<div style="margin-top:8px;border-left:3px solid #4c8dff;padding-left:10px">起手句：'+esc(q.hook)+'</div>';
  if(rec.judged&&rec.ok===false&&q.fix)html+='<div style="margin-top:8px;border-left:3px solid #ff6b6b;padding-left:10px">'+esc(q.fix)+'</div>';
  html+='<div class="dim" style="font-size:12px;margin-top:6px">下次出现：'+(h&&h.due?h.due:'')+'</div>';
  html+='<button class="btn wide" style="margin-top:12px" onclick="nextQ()">下一题</button>';
  html+='</div>';
  document.querySelector('.card').insertAdjacentHTML('beforeend',html);
  var f=$('fill');if(f){f.disabled=true}
  var bs=document.querySelectorAll('.opt');
  for(var i=0;i<bs.length;i++){
    var L='ABCDEFGH'[i];
    bs[i].disabled=true;
    if(norm(rec.ans).indexOf(L)>=0)bs[i].classList.add('right');
    else if((rec.mine||'').indexOf(L)>=0)bs[i].classList.add('wrong');
  }
  var sb=document.querySelector('#ansbox .btn');if(sb)sb.style.display='none';
  window.scrollTo(0,document.body.scrollHeight);
  refreshBar();
}

function nextQ(){
  S.qi++;
  if(S.qi>=S.set.length)S.set=buildQueue(),S.qi=0,S.rounds=(S.rounds||0)+1;
  renderQ();
}

/* ---------- 刷完 ---------- */
function renderDone(){
  $('app').innerHTML='<div class="card"><div class="stem">今天的题库过完了（'+ALL.length+' 题）</div>'+
   '<div class="dim" style="margin-top:8px">本次已刷 '+S.res.length+' 题，答题记录已在本机，等同步。</div>'+
   '<button class="btn wide" style="margin-top:14px" onclick="restart()">再从头刷一遍</button>'+
   '<button class="btn ghost wide" onclick="renderRecords()">看记录 / 导出</button></div>';
  refreshBar();
}
function restart(){S.qi=0;S.set=buildQueue();renderQ()}

/* ---------- 自动导出（每满 10 条，下一次点击时静默存一份）---------- */
var AUTO_N=parseInt((location.search.match(/[?&]auto=(\d+)/)||[])[1]||"10",10);
function maybeAutoExport(){
  if(pending()>=AUTO_N)doExport(true,true);
}
// 切走/锁屏时也存一份（浏览器可能拦，不报错）
var pauseAt=0;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    pauseAt=Date.now();
    if(pending()>0){try{doExport(true,true)}catch(e){}}
  }else if(pauseAt){
    if(S&&S.t0)S.t0+=Date.now()-pauseAt;   // 切走的时间不算答题用时
    pauseAt=0;
  }
});
function jsonl(list){
  return list.map(function(r){
    var o={};for(var k in r){if(k!=='exp')o[k]=r[k]}
    return JSON.stringify(o);
  }).join('\n')+'\n';
}
function doExport(all,silent){
  var arr=recsRaw();
  var list=all?arr:arr.filter(function(r){return !lastExp()||r.ts>lastExp()});
  if(!list.length){if(!silent)toast('没有待导出的记录');return}
  var txt=jsonl(list);
  var d=new Date();
  var name='quizrec-'+ymd(d).replace(/-/g,'')+'-'+p2(d.getHours())+p2(d.getMinutes())+'-'+list.length+'.jsonl';
  try{
    var blob=new Blob([txt],{type:'application/json;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);
  }catch(e){toast('下载失败，用「复制文本」');return}
  try{localStorage.setItem("qz_last_exp",nowIso())}catch(e){}
  toast('已自动存一份：'+list.length+' 条（Download）');
  refreshBar();
}
/* 【2026-10-30 新增】只导今天；可选导完清零今天的记录（复习历史 histRaw 不动） */
function saveList(list,label){
  if(!list.length){toast('今天还没有记录');return false}
  var txt=jsonl(list), d=new Date();
  var name='quizrec-'+ymd(d).replace(/-/g,'')+'-'+p2(d.getHours())+p2(d.getMinutes())+'-'+list.length+'.jsonl';
  try{
    var blob=new Blob([txt],{type:'application/json;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);
  }catch(e){toast('下载失败，用「显示/复制 JSONL」');return false}
  toast(label+'：'+list.length+' 条');
  return true;
}
function exportToday(){ saveList(todayRecs(),'已导出今日'); refreshBar(); }
function exportTodayClear(){
  var list=todayRecs();
  if(!list.length){toast('今天还没有记录');return}
  if(!confirm('导出今日 '+list.length+' 条，然后清零今天的记录？（复习进度保留）'))return;
  if(!saveList(list,'已导出今日'))return;
  var keep=recsRaw().filter(function(r){return String(r.ts||'').slice(0,10)!==TD});
  recsSet(keep);
  S.res=[];S.qi=0;S.judged=false;S.set=buildQueue();
  toast('今日已清零，可继续刷');
  renderRecords();
}

/* ---------- 记录页 ---------- */
function renderRecords(){
  var arr=recsRaw();
  var un=arr.filter(function(r){return !lastExp()||r.ts>lastExp()});
  var html='<div class="card"><div class="stem">本机记录 '+arr.length+' 条 · 待导出 '+un.length+' 条</div>';
  html+='<div class="dim" style="margin-top:6px">导出后文件在 Download，手机连电脑时自动并进答题台账。</div>';
  var tn=todayRecs().length;
  html+='<button class="btn wide" style="margin-top:12px" onclick="doExport(false)">导出待导出（'+un.length+'）</button>';
  html+='<button class="btn wide" style="margin-top:8px" onclick="exportToday()">导出今日（'+tn+' 条）</button>';
  html+='<button class="btn ghost wide" onclick="exportTodayClear()">导出今日并清零（'+tn+' 条）</button>';
  html+='<button class="btn ghost wide" onclick="doExport(true)">导出全部（'+arr.length+'）</button>';
  html+='<button class="btn ghost wide" onclick="showText()">显示 / 复制 JSONL 文本</button>';
  html+='<div id="txt"></div>';
  html+='<button class="btn ghost wide" style="margin-top:20px" onclick="clearRecs()">清空本机记录</button>';
  html+='<button class="btn ghost wide" onclick="S.qi=0;S.set=buildQueue();renderQ()">回到刷题</button></div>';
  $('app').innerHTML=html;refreshBar();
}
function showText(){
  $('txt').innerHTML='<textarea id="cp" class="mono" style="height:200px;margin-top:10px">'+esc(jsonl(recsRaw()))+'</textarea>'+
   '<button class="btn ghost wide" onclick="copyText()">复制全部</button>';
}
function copyText(){var t=$('cp');t.select();try{document.execCommand('copy');toast('已复制')}catch(e){toast('请长按手动复制')}}
function clearRecs(){
  if(!confirm('清空本机答题记录？复习进度会保留。'))return;
  recsSet([]);renderRecords();
}

/* ---------- PWA ---------- */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    try{reg.update()}catch(e){}
    document.addEventListener("visibilitychange",function(){if(!document.hidden){try{reg.update()}catch(e){}}});
  }).catch(function(e){});
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    var once=false;try{once=!!sessionStorage.getItem("wb_sw_reload")}catch(e){}
    if(once)return;
    try{sessionStorage.setItem("wb_sw_reload","1")}catch(e){}
    setTimeout(function(){location.reload()},120);
  });
}
/* ---------- 启动 ---------- */
renderQ();
if(/[?&]export=1/.test(location.search)){setTimeout(function(){doExport(true,true)},900)}
</script>
